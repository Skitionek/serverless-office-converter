# Publishes web/ (the converter UI plus the packaged LibreOffice WebAssembly
# runtime in web/office-converter/lo/) to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the LibreOffice runtime is present
        run: |
          test -f web/office-converter/lo/manifest.json || {
            echo "::warning::web/office-converter/lo/manifest.json is missing; run build/build-libreoffice-wasm.sh locally and commit web/office-converter/lo/."
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
