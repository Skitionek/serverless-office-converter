<!doctype html>
<!-- Link-preview image (Open Graph / Twitter card). Rendered to web/social-preview.png by
     build/social-preview.cjs; the layout follows the viewport (1200×630, or 1280×640 for GitHub). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    :root {
        --bg: #f6f7f9;
        --text: #1d2127;
        --muted: #5b6470;
        --border: #d9dee4;
        --brand: #0f7d02;
        --brand-2: #18a303;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
    body {
        font-family: Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 88% 12%, rgb(24 163 3 / 0.16), transparent 42%),
            radial-gradient(circle at 70% 100%, rgb(24 163 3 / 0.10), transparent 45%),
            radial-gradient(rgb(29 33 39 / 0.07) 1.4px, transparent 1.6px) 0 0 / 28px 28px,
            var(--bg);
        display: grid;
        grid-template-columns: 1fr 390px;
        align-items: center;
        gap: 24px;
        padding: 56px 52px 52px 72px;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0 auto 0 0;
        width: 12px;
        background: linear-gradient(var(--brand-2), var(--brand));
    }

    .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
    .brand svg { width: 46px; height: 46px; }
    h1 {
        font-family: "Inter Display", Inter, system-ui, sans-serif;
        font-size: 60px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 800;
        margin: 30px 0 18px; white-space: nowrap;
    }
    h1 em { font-style: normal; color: var(--brand); }
    .sub { font-size: 26px; line-height: 1.38; color: var(--muted); margin: 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 0; padding: 0; list-style: none; }
    .badges li {
        font-size: 20px; font-weight: 600; color: var(--brand);
        background: #fff; border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 16px;
    }
    .badges li::before { content: "✓ "; font-weight: 800; }
    .url { margin-top: 30px; font-size: 21px; color: var(--muted); font-weight: 500; }
    .url b { color: var(--text); font-weight: 600; }

    /* Right: three office documents become a PDF. */
    .art { position: relative; height: 450px; }
    .doc {
        position: absolute; width: 168px; height: 216px; border-radius: 14px;
        background: #fff; border: 1.5px solid var(--border);
        box-shadow: 0 18px 40px -16px rgb(16 24 40 / 0.28), 0 2px 6px rgb(16 24 40 / 0.06);
        padding: 72px 20px 0; overflow: hidden;
    }
    .doc::after { /* folded corner */
        content: ""; position: absolute; top: -1px; right: -1px; width: 38px; height: 38px;
        background: linear-gradient(225deg, var(--bg) 50%, #e3e7ec 50%);
        border-bottom-left-radius: 8px;
    }
    .doc i { display: block; height: 10px; border-radius: 5px; background: #e4e8ed; margin-bottom: 13px; }
    .doc i:nth-child(2) { width: 82%; }
    .doc i:nth-child(3) { width: 92%; }
    .doc i:nth-child(4) { width: 64%; }
    .doc .tag {
        position: absolute; left: 16px; top: 20px;
        font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: #fff;
        padding: 5px 13px; border-radius: 8px;
    }
    .d1 { left: 0; top: 22px; transform: rotate(-8deg); }
    .d2 { left: 100px; top: 4px; transform: rotate(-1deg); }
    .d3 { left: 200px; top: 26px; transform: rotate(7deg); }
    .d1 .tag { background: #2b579a; }
    .d2 .tag { background: #217346; }
    .d3 .tag { background: #c43e1c; }
    .pdf { left: 150px; top: 196px; width: 200px; height: 250px; transform: rotate(-2deg); padding-top: 84px;
        border-color: rgb(24 163 3 / 0.55); box-shadow: 0 24px 50px -18px rgb(15 125 2 / 0.45), 0 2px 6px rgb(16 24 40 / 0.08); }
    .pdf .tag { background: #d93025; font-size: 27px; }
    .arrow {
        position: absolute; left: 50px; top: 268px; width: 112px; height: 112px; border-radius: 50%;
        background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff;
        display: grid; place-items: center; box-shadow: 0 14px 30px -10px rgb(15 125 2 / 0.6);
        border: 6px solid var(--bg);
    }
    .arrow svg { width: 50px; height: 50px; }
</style>
</head>
<body>
<main>
    <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="2" width="22" height="28" rx="3" fill="#18a303"/><path d="M10 10h12M10 15h12M10 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Office Converter
    </div>
    <h1>Convert office files<br><em>right in your browser.</em></h1>
    <p class="sub">Word, Excel, PowerPoint and OpenDocument to PDF, DOCX, PNG and more, powered by LibreOffice.</p>
    <ul class="badges">
        <li>Nothing uploaded</li>
        <li>Nothing to install</li>
        <li>Works offline</li>
    </ul>
    <div class="url"><b>skitionek.github.io</b>/serverless-office-converter</div>
</main>
<div class="art" aria-hidden="true">
    <div class="doc d1"><i></i><i></i><i></i><i></i><span class="tag">DOCX</span></div>
    <div class="doc d2"><i></i><i></i><i></i><i></i><span class="tag">XLSX</span></div>
    <div class="doc d3"><i></i><i></i><i></i><i></i><span class="tag">PPTX</span></div>
    <div class="doc pdf"><i></i><i></i><i></i><i></i><span class="tag">PDF</span></div>
    <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>
</body>
</html>
