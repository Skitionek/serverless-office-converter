# Publishes web/office-converter/ (serverless-office-converter) and
# web/office-thumbnail/ (serverless-office-thumbnail) to npm, with provenance.
#
# Runs when a GitHub release is published, or by hand (Actions -> Publish to npm
# -> Run workflow). A package whose version is already on npm is skipped, so bump
# "version" in its package.json before releasing.
#
# One-time setup: create an npm "Automation" (or granular, publish) token at
# npmjs.com -> Access Tokens and save it as the repository secret NPM_TOKEN
# (Settings -> Secrets and variables -> Actions).
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check that the LibreOffice runtime is present
        run: test -f web/office-converter/lo/manifest.json
      # The converter goes first: the thumbnail package has it as a peer dependency.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in web/office-converter web/office-thumbnail; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done
